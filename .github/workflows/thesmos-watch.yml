##
## Thesmos Watch — Revert Watcher
## by Holley Studio
##
## Runs as a GitHub Action, not a local poll: a safety guarantee that depends
## on the user keeping a terminal open is not a guarantee. Fires on every
## push to main, then `thesmos pr:watch` determines for itself whether main's
## check suite actually came back red — the trigger alone doesn't mean that,
## since it fires on every push, not just a failing one. If it is red and a
## Thesmos-performed merge is the culprit, it opens and merges a revert PR
## (see thesmos/pr/revert.ts and thesmos/bin/commands/pr.ts).
##
## Required permissions (set at job level below — no repo-wide change needed):
##   contents:      write  — checkout the code, let `gh pr merge` land the revert commit, and
##                           push the updated ledger/sentinel back (see thesmos/pr/sync.ts;
##                           a protected default branch may reject that push, which is
##                           reported, not fatal)
##   pull-requests: write  — open the revert PR (`gh pr revert`) and merge it (`gh pr merge`)
##   checks:        read   — read main's check-run conclusions via the GitHub Checks API to
##                           tell "a push just happened" apart from "checks came back red".
##                           This repo's CI runs as GitHub Actions jobs, which report through
##                           Check Runs, not the legacy commit-status endpoint — so this is
##                           `checks: read`, not `statuses: read`.
##
## Setup:
##   Nothing to configure. Generated as part of the governed PR merge engine
##   (`thesmos pr:watch`); reads and writes .thesmos/pr-ledger.jsonl in the
##   checked-out repo. That file is deliberately NOT git-ignored — it is the
##   only state this Action and the local CLI share, and while it was ignored
##   this job read an empty ledger on every run and could never revert anything.
##

name: Thesmos Watch

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  watch:
    name: Revert on regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 20

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check main and revert a Thesmos merge if it regressed
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx tsx thesmos/bin/cli.ts pr:watch --range 5
