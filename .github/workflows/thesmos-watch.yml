##
## Thesmos Watch — Revert Watcher
## by Holley Studio
##
## Runs as a GitHub Action, not a local poll: a safety guarantee that depends
## on the user keeping a terminal open is not a guarantee. Fires on every
## push to main, then `thesmos pr:watch` determines for itself whether main's
## check suite actually came back red — the trigger alone doesn't mean that,
## since it fires on every push, not just a failing one. If it is red and a
## Thesmos-performed merge is the culprit, it opens and merges a revert PR
## (see thesmos/pr/revert.ts and thesmos/bin/commands/pr.ts).
##
## How it knows what Thesmos merged: it ASKS GITHUB, not the checked-out tree.
## `thesmos pr:merge` labels every pull request it merges `thesmos-merged`, and this job
## lists merged pull requests carrying that label (and not `thesmos-reverted`) to find a
## culprit — see thesmos/pr/marks.ts. It deliberately does NOT read
## .thesmos/pr-ledger.jsonl: that file only reaches a checkout if the CLI can push it to
## the default branch, and this repository's `main` ruleset rejects that push with no
## bypass actor, so the ledger was empty on every run and this job could never revert
## anything. The ledger remains the local audit trail; it is not this job's input.
##
## Required permissions (set at job level below — no repo-wide change needed):
##   contents:      write  — checkout the code, let `gh pr merge` land the revert commit, and
##                           push the updated ledger/sentinel back (see thesmos/pr/sync.ts;
##                           a protected default branch may reject that push, which is
##                           reported, not fatal — auto-revert no longer depends on it)
##   pull-requests: write  — open the revert PR (`gh pr revert`), merge it (`gh pr merge`),
##                           and label merges/reverts (`gh pr edit --add-label`)
##   issues:        write  — create the `thesmos-merged` / `thesmos-reverted` labels the
##                           first time they are needed (`gh label create`). Labels are
##                           issue-scoped in the REST API, so `pull-requests: write` alone
##                           cannot create one.
##   checks:        read   — read main's check-run conclusions via the GitHub Checks API to
##                           tell "a push just happened" apart from "checks came back red".
##                           This repo's CI runs as GitHub Actions jobs, which report through
##                           Check Runs, not the legacy commit-status endpoint — so this is
##                           `checks: read`, not `statuses: read`.
##
## Setup:
##   Nothing to configure. Generated as part of the governed PR merge engine
##   (`thesmos pr:watch`).
##

name: Thesmos Watch

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read

jobs:
  watch:
    name: Revert on regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 20

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check main and revert a Thesmos merge if it regressed
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx tsx thesmos/bin/cli.ts pr:watch --range 5
